<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>高度表转换练习</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f4f6f8;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    .question {
      font-size: 28px;
      margin: 20px 0;
    }
    input {
      font-size: 20px;
      padding: 10px;
      width: 80%;
      text-align: center;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin-top: 15px;
    }
    .timer {
      font-size: 16px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>高度表转换练习</h1>

<div class="card" id="card">
  <button id="startBtn">开始测试</button>
</div>

<script>
const data = [
  [12500, 41100],[11900,39100],[11300,37100],[10700,35100],
  [10100,33100],[9500,31100],[8900,29100],[8100,26600],
  [7500,24600],[6900,22600],[6300,20700],[5700,18700],
  [5100,16700],[4500,14800],[3900,12800],[3300,10800],
  [2700,8900],[2100,6900],[1500,4900],[900,3000],
  [12200,40100],[11600,38100],[11000,36100],[10400,34100],
  [9800,32100],[9200,30100],[8400,27600],[7800,25600],
  [7200,23600],[6600,21700]
];

let questions = [];
let index = 0;
let correct = 0;
let timer;
let timeLeft = 5;

const card = document.getElementById("card");

document.getElementById("startBtn").onclick = start;

function start() {
  questions = data.sort(() => Math.random() - 0.5).slice(0, 30);
  index = 0;
  correct = 0;
  next();
}

function next() {
  if (index >= questions.length) {
    card.innerHTML = `<h2>完成</h2>
    <p>正确率：${Math.round(correct / questions.length * 100)}%</p>`;
    return;
  }

  timeLeft = 5;
  const [m, ft] = questions[index];

  card.innerHTML = `
    <div class="question">${m} 米 = ? 英尺</div>
    <input id="ans" autofocus />
    <div class="timer">剩余 ${timeLeft} 秒</div>
    <button onclick="submit()">下一题</button>
  `;

  document.getElementById("ans").addEventListener("keydown", e => {
    if (e.key === "Enter") submit();
  });

  timer = setInterval(() => {
    timeLeft--;
    document.querySelector(".timer").innerText = `剩余 ${timeLeft} 秒`;
    if (timeLeft <= 0) submit();
  }, 1000);
}

function submit() {
  clearInterval(timer);
  const input = document.getElementById("ans");
  if (input && Number(input.value) === questions[index][1]) {
    correct++;
  }
  index++;
  next();
}
</script>

</body>
</html>
